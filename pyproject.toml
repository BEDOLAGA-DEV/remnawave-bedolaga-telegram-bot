[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = [
    'S101',
    'ARG',
    'S105',
    'S106',
    'PT',
    'E402',
    'PLC0415',
    'EM101',
    'EM102',
    'TRY003',
    'INP001',
]
'**/migrations/**/*.py' = [
    'ALL',
]
'app/lib/**/*.py' = [
    'ALL',
]
'main.py' = [
    'E402',
    'PLC0415',
]
'app/bot.py' = [
    'E402',
    'PLC0415',
]
'app/**/*.py' = [
    'ARG001',
    'ARG002',
    'BLE001',
    'PLC0415',
    'E402',
    'EM101',
    'EM102',
    'INP001',
    'S101',
]
'*.py' = [
    'INP001',
]
'**/__init__.py' = [
    'F401',
    'F403',
]

[tool.ruff.lint.isort]
known-first-party = ['app']
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 25
max-returns = 10
max-statements = 100
max-locals = 25

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.flake8-quotes]
docstring-quotes = 'double'
inline-quotes = 'single'

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
skip-magic-trailing-comma = false
line-ending = 'auto'
docstring-code-format = true
docstring-code-line-length = 'dynamic'

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '--strict-markers --strict-config'
markers = [
    'asyncio: запуск асинхронного теста через встроенный цикл событий',
    'anyio: запуск асинхронного теста через встроенный цикл событий',
    'postgres: тесту нужен настоящий PostgreSQL из TEST_DATABASE_URL',
    'bschek_live: живой bschekbot API, нужен BSCHEK_LIVE_API_KEY; только бесплатные ручки, денег не тратит',
]
