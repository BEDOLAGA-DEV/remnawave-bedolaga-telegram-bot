[project]
name = 'remnawave-bedolaga-telegram-bot'
version = "4.7.1"
description = 'Telegram bot for RemnaWave VPN service'
readme = 'README.md'
license = { text = 'MIT' }
requires-python = '==3.13.*'
dependencies = [
    'aiogram==3.31.0',
    'sqlalchemy==2.0.52',
    'greenlet==3.5.5',
    'alembic==1.19.2',
    'asyncpg==0.31.0',
    'aiosqlite==0.22.1',
    'fastapi[standard]==0.141.1',
    'redis==8.1.0',
    'pyyaml==6.0.3',
    'yookassa==3.12.1',
    'python-dateutil==2.9.0.post0',
    'cryptography==50.0.1',
    'qrcode[pil]==8.2',
    'packaging==26.3',
    'bcrypt==5.0.0',
    'pyjwt==2.13.0',
    'pyzipper==0.4.0',
    'structlog==26.1.0',
    'rich==15.0.0',
    'aiohttp-socks==0.12.0',
    'httpx[socks]==0.28.1',
    'pycryptodome==3.23.0',
    'app-store-server-library[async]==3.1.2',
    'aiohttp==3.14.3',
    'aiofiles==25.1.0',
    'pydantic==2.13.5',
    'pydantic-settings==2.15.0',
    'uvicorn==0.52.4',
    'starlette==1.6.0',
    'attrs==26.1.0',
    'pillow==12.3.0',
]

[dependency-groups]
dev = [
    'ruff==0.16.6',
    'pytest==9.1.1',
    'pytest-asyncio==1.4.0',
    'pytest-cov==7.1.0',
]

[tool.uv]
package = false

[tool.ruff]
target-version = 'py313'
line-length = 120
exclude = [
    '.bzr',
    '.direnv',
    '.eggs',
    '.git',
    '.git-rewrite',
    '.hg',
    '.mypy_cache',
    '.nox',
    '.pants.d',
    '.pytype',
    '.ruff_cache',
    '.svn',
    '.tox',
    '.venv',
    '__pypackages__',
    '_build',
    'buck-out',
    'build',
    'dist',
    'node_modules',
    'venv',
    'migrations',
]

