name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest

    # 18 — тот же образ, что и в docker-compose.yml: на нём весь прогон.
    # 15 — версия до перехода (make pg-upgrade): пока пользователи могут на неё
    # откатиться, гоняем на ней тесты с меткой postgres — только они зависят
    # от версии сервера.
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '18'
            full_suite: true
          - postgres: '15'
            full_suite: false

    # Проверки блокировок строк, ограничений VARCHAR и TIMESTAMPTZ имеют смысл
    # только против настоящего PostgreSQL: на SQLite они молча проходят,
    # ничего не проверяя.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      # Без базы тесты на PostgreSQL молча пропускаются — в CI это выглядит
      # как успех. Флаг превращает пропуск в падение.
      REQUIRE_POSTGRES_TESTS: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Sync dependencies (locked)
        run: uv sync --frozen --group dev

      # Отдельным шагом и первыми: если инфраструктура PostgreSQL сломалась,
      # это должно быть видно сразу, а не утонуть в общем прогоне.
      - name: Run PostgreSQL tests
        run: uv run pytest -m postgres -q

      - name: Run full test suite
        if: matrix.full_suite
        run: uv run pytest -q
