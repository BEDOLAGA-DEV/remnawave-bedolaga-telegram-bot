services:
  postgres:
    image: postgres:15-alpine
    container_name: remnawave_bot_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remnawave_bot}
      POSTGRES_USER: ${POSTGRES_USER:-remnawave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot_network
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-remnawave_user} -d ${POSTGRES_DB:-remnawave_bot}' ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: remnawave_bot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - bot_network
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    container_name: remnawave_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FORCE_COLOR: '1'
      DOCKER_ENV: 'true'
      DATABASE_MODE: 'auto'
      POSTGRES_HOST: 'postgres'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: '${POSTGRES_DB:-remnawave_bot}'
      POSTGRES_USER: '${POSTGRES_USER:-remnawave_user}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}'

      REDIS_URL: 'redis://redis:6379/0'

      TZ: 'Europe/Moscow'
      LOCALES_PATH: '${LOCALES_PATH:-/app/locales}'
    volumes:
      # Логи
      - ./logs:/app/logs:rw
      # - ./.env:/app/.env:rw
      # - ./.env.new:/app/.env.new:rw
      # Данные приложения (для SQLite в случае переключения)
      - ./data:/app/data:rw
      - ./locales:/app/locales:rw
      # Timezone
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # Загруженные медиафайлы (изображения/видео для новостей)
      - ./uploads:/app/uploads:rw
      # Логотип для сообщений (.mp4/.gif — анимация, .png — фото)
      # - ./nozapret.mp4:/app/nozapret.mp4:ro
      # - ./vpn_logo.png:/app/vpn_logo.png:ro
    ports:
      - '${WEB_API_PORT:-8080}:${WEB_API_PORT:-8080}'
    networks:
      - bot_network
    healthcheck:
      # Hit the auth-free unified health endpoint on the real API port (127.0.0.1
      # to force IPv4). The old check used default port 8080 (not WEB_API_PORT)
      # and an empty X-API-Key -> connection refused / 401 -> false-unhealthy.
      test: [ 'CMD-SHELL', 'python -c "import os,urllib.request; urllib.request.urlopen(f''http://127.0.0.1:{os.environ.get(\"WEB_API_PORT\",\"8181\")}/health/unified'', timeout=5)"' ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  cabinet-frontend:
    # Web cabinet (React SPA) served by nginx.
    # Built from the sibling bedolaga-cabinet repo. The nginx config is
    # overridden via volume mount so /api/ proxies to the internal bot
    # service instead of an external backend.
    build:
      context: ./bedolaga-cabinet
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-Cabinet}
        VITE_APP_LOGO: ${VITE_APP_LOGO:-V}
    container_name: remnawave_bot_cabinet
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      bot:
        condition: service_started
    volumes:
      # Override the image's default nginx config so /api/ proxies
      # to the bot service on the internal docker network.
      - ./docker/cabinet-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${CABINET_PORT:-3020}:80'
    networks:
      - bot_network
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:80/' ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bot_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.driver.mtu: 1350
