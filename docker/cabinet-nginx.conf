# nginx config for the cabinet-frontend service when run INSIDE the main
# docker-compose.yml (alongside postgres/redis/bot).
#
# This file is volume-mounted over the cabinet image's default
# /etc/nginx/conf.d/default.conf, so the existing bedolaga-cabinet/nginx.conf
# (which talks to an external backend) stays untouched for standalone use.
#
# /api/ is proxied to the `bot` service by docker DNS on port 8181 — the
# internal port that app.webapi / app.webserver listens on.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-API routes serve index.html so client-side
    # routing works for /login, /profile, /admin, etc.
    location / {
        try_files $uri /index.html;
    }

    # Proxy /api/ to the bot container on the internal docker network.
    # Trailing slash on proxy_pass rewrites /api/cabinet/... -> /cabinet/...
    # which matches the FastAPI router prefix in app/cabinet/routes/__init__.py.
    location /api/ {
        proxy_pass http://bot:8181/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for the cabinet's realtime notifications channel
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Long-lived caching for hashed static assets from vite build.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
